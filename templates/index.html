<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favourites</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #111; color: #eee; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
    .card { cursor: pointer; }
    .card img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover;
                border-radius: 8px; display: block; background: #222; }
    .author { font-weight: 600; margin-top: .5rem; font-size: .9rem; }
    .caption { font-size: .8rem; opacity: .7; line-height: 1.3; }
    .open { font-size: .75rem; opacity: .5; color: inherit; }
    .status { margin-top: 2rem; text-align: center; opacity: .6; }

    #player { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .94);
              display: flex; align-items: center; justify-content: center; gap: 1rem; }
    #player[hidden] { display: none; }
    #frame {
      /* Sized by height; the aspect ratio sets the width. max-width stops it
         overlapping the arrow buttons on short, wide windows. */
      height: 94vh;
      aspect-ratio: 325 / 580;
      max-width: calc(100vw - 9rem);
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
    }
    #frame iframe { width: 100%; height: 100%; border: 0; display: block; }
    #player button { background: #222; color: #eee; border: 0; border-radius: 999px;
                     width: 46px; height: 46px; font-size: 1.1rem; cursor: pointer; }
    #player button:hover { background: #333; }
    #close { position: absolute; top: 1.5rem; right: 1.5rem; }
    #counter { position: absolute; top: 1.5rem; left: 1.5rem; opacity: .6; font-size: .85rem; }
  </style>
</head>
<body>

<div class="grid">
  {% include "_cards.html" %}
</div>

<div id="sentinel"
     data-next-page="{{ page + 1 }}"
     data-last-page="{{ last_page }}"
     data-total="{{ total }}"></div>

<p class="status" id="status">{{ total }} favourites</p>

<div id="player" hidden>
  <span id="counter"></span>
  <button id="close" title="Close (Esc)">✕</button>
  <button id="prev" title="Previous (↑)">↑</button>
  <div id="frame"></div>
  <button id="next" title="Next (↓)">↓</button>
</div>

<script>
  const player   = document.getElementById('player');
  const frame    = document.getElementById('frame');
  const counter  = document.getElementById('counter');
  const status   = document.getElementById('status');
  const sentinel = document.getElementById('sentinel');

  const lastPage = Number(sentinel.dataset.lastPage);
  const total    = Number(sentinel.dataset.total);
  let nextPage   = Number(sentinel.dataset.nextPage);
  let loading    = false;
  let current    = -1;

  function cards() {
    return Array.from(document.querySelectorAll('.card'));
  }

  function show(index) {
    const list = cards();
    if (index < 0 || index >= list.length) return;
    current = index;
    frame.innerHTML =
      '<iframe src="https://www.tiktok.com/player/v1/' + list[index].dataset.id +
      '?autoplay=1&loop=1&music_info=0&description=0&rel=0"' +
      ' allow="autoplay; fullscreen"></iframe>';
    counter.textContent = (index + 1) + ' of ' + list.length;
    player.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  // TikTok's player/v1 accepts commands as {type, value, 'x-tiktok-player': true}
  // and emits its own events back the same way. Sending on onPlayerReady beats
  // guessing with a timer.
  function send(type, value) {
    const iframe = frame.querySelector('iframe');
    if (iframe && iframe.contentWindow) {
      iframe.contentWindow.postMessage(
        { type: type, value: value, 'x-tiktok-player': true }, '*'
      );
    }
  }

  window.addEventListener('message', event => {
    const data = event.data;
    if (!data || typeof data !== 'object' || !data['x-tiktok-player']) return;
    if (data.type === 'onPlayerReady') {
      send('unMute');
      send('setVolume', 100);
      send('play');
    }
  });

  function closePlayer() {
    player.hidden = true;
    frame.innerHTML = '';
    document.body.style.overflow = '';
  }

  document.querySelector('.grid').addEventListener('click', event => {
    if (event.target.closest('.open')) return;
    const card = event.target.closest('.card');
    if (card) show(cards().indexOf(card));
  });

  player.addEventListener('click', event => {
    if (event.target === player) closePlayer();
  });

  document.getElementById('close').addEventListener('click', closePlayer);
  document.getElementById('prev').addEventListener('click', () => show(current - 1));
  document.getElementById('next').addEventListener('click', () => show(current + 1));

  document.addEventListener('keydown', event => {
    if (player.hidden) return;
    if (event.key === 'Escape') closePlayer();
    if (event.key === 'ArrowDown' || event.key === 'ArrowRight') show(current + 1);
    if (event.key === 'ArrowUp'   || event.key === 'ArrowLeft')  show(current - 1);
  });

  new IntersectionObserver(entries => {
    if (!entries[0].isIntersecting || loading || nextPage > lastPage) return;
    loading = true;
    fetch('/cards?page=' + nextPage)
      .then(response => response.text())
      .then(html => {
        document.querySelector('.grid').insertAdjacentHTML('beforeend', html);
        nextPage++;
        loading = false;
        status.textContent = cards().length + ' of ' + total + ' loaded';
      });
  }, { rootMargin: '600px' }).observe(sentinel);
</script>

</body>
</html>
